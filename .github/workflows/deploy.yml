name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  release:
    types: [created]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  ENVIRONMENT: production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: TEST_REPORT.md
          retention-days: 30

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "imgbed-worker"
          main = "src/index.ts"
          compatibility_date = "2024-04-01"
          compatibility_flags = ["nodejs_compat"]

          [vars]
          ENVIRONMENT = "production"
          TELEGRAM_BOT_TOKEN = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHANNEL_ID = "${{ secrets.TELEGRAM_CHANNEL_ID }}"
          TELEGRAM_WEBHOOK_SECRET = "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"
          SECRET_KEY = "${{ secrets.SECRET_KEY }}"
          JWT_ALGORITHM = "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES = 1440
          MAX_FILE_SIZE = 104857600
          ALLOWED_IMAGE_TYPES = "image/jpeg,image/png,image/gif,image/webp"
          ALLOWED_VIDEO_TYPES = "video/mp4,video/webm,video/quicktime"

          [[d1_databases]]
          binding = "DB"
          database_name = "imgbed-db"
          database_id = "${{ secrets.CLOUDFLARE_D1_DB_ID }}"

          [[r2_buckets]]
          binding = "MEDIA_BUCKET"
          bucket_name = "imgbed-media"

          [triggers]
          crons = ["0 0 * * *"]
          EOF

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Run database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply imgbed-db --remote

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo "📦 Worker: imgbed-worker"
          echo "🗄️  D1 Database: imgbed-db"
          echo "💾 R2 Bucket: imgbed-media"
          echo "🔗 URL: https://imgbed-worker.<your-account>.workers.dev"

{% extends "base.html" %}

{% block title %}上传 - 图床{% endblock %}

{% block extra_css %}
<style>
    .upload-area {
        border: 3px dashed #667eea;
        border-radius: 15px;
        padding: 60px 20px;
        text-align: center;
        transition: all 0.3s;
        cursor: pointer;
    }
    .upload-area:hover, .upload-area.drag-over {
        border-color: #764ba2;
        background: rgba(102, 126, 234, 0.05);
    }
    .upload-area h3 {
        color: #667eea;
        margin-bottom: 10px;
    }
    .upload-area p {
        color: #666;
    }
    .upload-icon {
        font-size: 4rem;
        margin-bottom: 20px;
    }
    #fileInput {
        display: none;
    }
    .preview-area {
        margin-top: 30px;
        display: none;
    }
    .preview-image {
        max-width: 100%;
        max-height: 300px;
        border-radius: 10px;
        margin-bottom: 20px;
    }
    .result-card {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        display: none;
    }
    .result-card.show {
        display: block;
    }
    .link-group {
        margin: 15px 0;
        padding: 10px;
        background: white;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .link-label {
        font-weight: 600;
        color: #667eea;
        min-width: 80px;
    }
    .link-url {
        flex: 1;
        padding: 8px 12px;
        background: #f0f0f0;
        border-radius: 5px;
        font-family: monospace;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .copy-btn {
        padding: 8px 15px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
    }
    .copy-btn:hover {
        background: #764ba2;
    }
    .uploading {
        text-align: center;
        padding: 20px;
        display: none;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .error-msg {
        color: #c33;
        margin-top: 10px;
        padding: 10px;
        background: #fee;
        border-radius: 5px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2>上传文件</h2>
    <p>支持图片（JPG、PNG、GIF、WebP）和视频（MP4、WebM），最大 100MB</p>
    
    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📤</div>
        <h3>点击或拖拽文件到此处上传</h3>
        <p>图片会自动生成原图、标准、低质量、图标四种版本</p>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*">
    
    <div class="uploading" id="uploading">
        <div class="spinner"></div>
        <p>正在上传处理中...</p>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <div class="result-card" id="resultCard">
        <h3 style="color: #383;">✅ 上传成功！</h3>
        <div id="linksContainer"></div>
        <div style="margin-top: 20px;">
            <button class="btn" onclick="location.reload()">继续上传</button>
            <a href="/dashboard" class="btn btn-secondary" style="margin-left: 10px;">查看管理</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const uploading = document.getElementById('uploading');
const errorMsg = document.getElementById('errorMsg');
const resultCard = document.getElementById('resultCard');
const linksContainer = document.getElementById('linksContainer');

uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('drag-over');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('drag-over');
});

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        handleFile(files[0]);
    }
});

fileInput.addEventListener('change', (e) => {
    const files = e.target.files;
    if (files.length > 0) {
        handleFile(files[0]);
    }
});

async function handleFile(file) {
    errorMsg.style.display = 'none';
    resultCard.style.display = 'none';
    
    const maxSize = 100 * 1024 * 1024;
    if (file.size > maxSize) {
        showError('文件大小超过 100MB 限制');
        return;
    }
    
    const allowedTypes = [
        'image/jpeg', 'image/png', 'image/gif', 'image/webp',
        'video/mp4', 'video/webm', 'video/quicktime'
    ];
    
    if (!allowedTypes.includes(file.type) && !file.type.startsWith('image/') && !file.type.startsWith('video/')) {
        showError('不支持的文件类型');
        return;
    }
    
    uploading.style.display = 'block';
    
    const formData = new FormData();
    formData.append('file', file);
    
    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
            showResult(data.file);
        } else {
            showError(data.detail || data.message || '上传失败');
        }
    } catch (error) {
        showError('网络错误，请稍后重试');
    } finally {
        uploading.style.display = 'none';
    }
}

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
}

function showResult(file) {
    const links = [
        { label: '原图', url: file.original_url },
        { label: '标准', url: file.standard_url },
        { label: '低质量', url: file.low_url },
        { label: '图标', url: file.icon_url }
    ];
    
    let html = '';
    for (const link of links) {
        if (link.url) {
            html += `
                <div class="link-group">
                    <span class="link-label">${link.label}</span>
                    <span class="link-url" title="${link.url}">${link.url}</span>
                    <button class="copy-btn" onclick="copyToClipboard('${link.url}', this)">复制</button>
                </div>
            `;
        }
    }
    
    linksContainer.innerHTML = html;
    resultCard.style.display = 'block';
}

async function copyToClipboard(text, btn) {
    try {
        await navigator.clipboard.writeText(text);
        const originalText = btn.textContent;
        btn.textContent = '已复制';
        btn.style.background = '#383';
        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = '';
        }, 2000);
    } catch (err) {
        alert('复制失败，请手动复制');
    }
}
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数可视化工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>函数可视化工具</h1>
            <div class="header-right">
                <select class="theme-select" id="themeSelect">
                    <option value="dark">🌙 深色主题</option>
                    <option value="light">☀️ 浅色主题</option>
                    <option value="blue">🌊 深蓝主题</option>
                    <option value="matrix">💚 黑客帝国</option>
                    <option value="sunset">🌅 日落主题</option>
                </select>
            </div>
        </header>
        
        <div class="main-content">
            <aside class="sidebar">
                <div class="panel-section">
                    <h2 class="section-title">预设函数</h2>
                    <div class="presets-container" id="presetsContainer">
                    </div>
                </div>

                <div class="panel-section">
                    <h2 class="section-title">函数列表</h2>
                    <div class="functions-container" id="functionsContainer">
                    </div>
                    <button class="btn btn-secondary" id="addFunctionBtn">
                        + 添加函数
                    </button>
                </div>

                <div class="panel-section">
                    <h2 class="section-title">集合运算</h2>
                    <select class="form-select" id="operationSelect">
                        <option value="none">无运算 (独立显示)</option>
                        <option value="union">并集 (Union)</option>
                        <option value="intersection">交集 (Intersection)</option>
                        <option value="difference">差集 (Difference)</option>
                        <option value="symmetric_difference">对称差 (Symmetric Difference)</option>
                    </select>
                </div>

                <div class="panel-section">
                    <h2 class="section-title">参数配置</h2>
                    <div class="params-grid">
                        <div class="param-group">
                            <label>X 范围</label>
                            <div class="range-inputs">
                                <input type="number" id="xMin" value="-5" step="0.5" placeholder="min">
                                <span>到</span>
                                <input type="number" id="xMax" value="5" step="0.5" placeholder="max">
                            </div>
                        </div>
                        
                        <div class="param-group">
                            <label>Y 范围</label>
                            <div class="range-inputs">
                                <input type="number" id="yMin" value="-5" step="0.5" placeholder="min">
                                <span>到</span>
                                <input type="number" id="yMax" value="5" step="0.5" placeholder="max">
                            </div>
                        </div>
                        
                        <div class="param-group">
                            <label>分辨率: <span id="resolutionValue">50</span></label>
                            <input type="range" id="resolution" min="10" max="100" value="50">
                        </div>
                        
                        <div class="param-group">
                            <label>阈值 (epsilon)</label>
                            <input type="number" id="epsilon" value="0.5" step="0.1" min="0.01">
                        </div>
                    </div>
                </div>

                <div class="panel-section actions-section">
                    <button class="btn btn-primary" id="generateBtn">
                        生成
                    </button>
                    <button class="btn btn-secondary" id="resetViewBtn">
                        重置视图
                    </button>
                    <button class="btn btn-danger" id="clearBtn">
                        清空函数
                    </button>
                </div>
            </aside>

            <main class="viewer-area">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="threeCanvas"></canvas>
                    <button class="perf-toggle-btn" id="perfToggleBtn">
                        📊 性能
                    </button>
                    <div class="performance-panel hidden" id="performancePanel">
                        <div class="performance-title">📊 性能监控</div>
                        <div class="performance-item">
                            <span class="performance-label">FPS:</span>
                            <span class="performance-value good" id="perfFps">60</span>
                        </div>
                        <div class="performance-item">
                            <span class="performance-label">渲染时间:</span>
                            <span class="performance-value good" id="perfRender">0.5ms</span>
                        </div>
                        <div class="performance-item">
                            <span class="performance-label">API 请求:</span>
                            <span class="performance-value good" id="perfApi">-</span>
                        </div>
                        <div class="performance-item">
                            <span class="performance-label">顶点数:</span>
                            <span class="performance-value" id="perfVertices">0</span>
                        </div>
                        <div class="performance-item">
                            <span class="performance-label">面片数:</span>
                            <span class="performance-value" id="perfFaces">0</span>
                        </div>
                        <div class="performance-bottleneck">
                            <div class="bottleneck-label">瓶颈分析:</div>
                            <div class="bottleneck-value" id="perfBottleneck">就绪</div>
                        </div>
                    </div>
                </div>
                <div class="status-bar" id="statusBar">
                    <span class="status-item">顶点数: <span id="vertexCount">0</span></span>
                    <span class="status-item">面片数: <span id="faceCount">0</span></span>
                    <span class="status-item">状态: <span id="statusText">就绪</span></span>
                </div>
            </main>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script src="/static/js/renderer.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>

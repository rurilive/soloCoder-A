<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享的日记 - 我的在线日记本</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .share-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .share-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .share-header h1 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .share-header p {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .share-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        .share-card.locked {
            text-align: center;
        }
        
        .lock-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .share-info {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .share-info p {
            margin: 5px 0;
            color: #666;
            font-size: 0.9rem;
        }
        
        .password-form {
            margin-top: 20px;
        }
        
        .password-form .form-group {
            margin-bottom: 20px;
        }
        
        .password-form input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .password-form input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .diary-detail {
            margin-top: 20px;
        }
        
        .diary-detail .diary-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .diary-detail .diary-meta {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        
        .diary-detail .diary-content {
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        
        .diary-detail .diary-images {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .diary-detail .diary-image {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .diary-detail .diary-image:hover {
            transform: scale(1.05);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
        
        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="share-container">
        <div class="share-header">
            <h1>📒 分享的日记</h1>
            <p>这是一篇分享的日记，请输入密码查看</p>
        </div>
        
        <div class="share-card locked" id="shareCard">
            <div class="lock-icon">🔒</div>
            <h2>此日记已加密</h2>
            <p>请输入密码以查看这篇分享的日记</p>
            
            <div class="share-info">
                <p><strong>分享时间：</strong>{{ created_at }}</p>
                <p><strong>已访问次数：</strong>{{ access_count }}</p>
            </div>
            
            <form id="passwordForm" class="password-form">
                <div class="form-group">
                    <label for="sharePassword">密码</label>
                    <input type="password" id="sharePassword" name="password" placeholder="请输入密码..." required>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    🔓 解锁查看
                </button>
            </form>
        </div>
        
        <div class="share-card" id="diaryDetail" style="display: none;">
            <div class="diary-detail">
                <h1 class="diary-title" id="diaryTitle"></h1>
                <div class="diary-meta">
                    <span id="diaryCreatedAt"></span>
                </div>
                <div class="diary-content" id="diaryContent"></div>
                <div class="diary-images" id="diaryImages"></div>
            </div>
            <a href="/" class="back-link">← 返回日记本首页</a>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        class ShareApp {
            constructor() {
                this.shareToken = window.location.pathname.split('/').pop();
                this.bindEvents();
            }
            
            bindEvents() {
                const passwordForm = document.getElementById('passwordForm');
                if (passwordForm) {
                    passwordForm.addEventListener('submit', (e) => this.handleSubmit(e));
                }
            }
            
            async handleSubmit(e) {
                e.preventDefault();
                
                const passwordInput = document.getElementById('sharePassword');
                const errorMessage = document.getElementById('errorMessage');
                const password = passwordInput.value.trim();
                
                if (!password) {
                    this.showError(errorMessage, '请输入密码');
                    return;
                }
                
                errorMessage.classList.remove('show');
                
                try {
                    const formData = new FormData();
                    formData.append('password', password);
                    
                    const response = await fetch(`/api/share/${this.shareToken}/verify`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        this.showDiary(data.diary);
                    } else {
                        this.showError(errorMessage, data.message || '验证失败');
                    }
                } catch (error) {
                    console.error('验证失败:', error);
                    this.showError(errorMessage, '验证失败，请稍后重试');
                }
            }
            
            showDiary(diary) {
                const shareCard = document.getElementById('shareCard');
                const diaryDetail = document.getElementById('diaryDetail');
                
                if (shareCard) shareCard.style.display = 'none';
                if (diaryDetail) diaryDetail.style.display = 'block';
                
                const titleEl = document.getElementById('diaryTitle');
                const createdAtEl = document.getElementById('diaryCreatedAt');
                const contentEl = document.getElementById('diaryContent');
                const imagesEl = document.getElementById('diaryImages');
                
                if (titleEl) titleEl.textContent = diary.title;
                if (createdAtEl) createdAtEl.textContent = diary.created_at;
                if (contentEl) contentEl.textContent = diary.content;
                
                if (imagesEl && diary.images && diary.images.length > 0) {
                    imagesEl.innerHTML = '';
                    diary.images.forEach(img => {
                        const imgEl = document.createElement('img');
                        imgEl.src = img;
                        imgEl.alt = '日记图片';
                        imgEl.className = 'diary-image';
                        imagesEl.appendChild(imgEl);
                    });
                }
                
                this.showToast('验证成功，正在显示日记...', 'success');
            }
            
            showError(element, message) {
                if (element) {
                    element.textContent = message;
                    element.classList.add('show');
                }
            }
            
            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                if (!toast) return;
                
                toast.textContent = message;
                toast.className = `toast ${type} show`;
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new ShareApp();
        });
    </script>
</body>
</html>

{% extends "base.html" %}

{% block title %}{{ title }} - 瀑布流博客{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/form.css">
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1 class="form-title">管理员登录</h1>
        <p class="form-subtitle">请使用管理员账号登录</p>
    </div>

    {% if error %}
    <div class="form-error">
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form action="/login" method="post" class="blog-form">
        <div class="form-group">
            <label for="username" class="form-label">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">登录</button>
            <a href="/" class="btn btn-secondary btn-lg">返回首页</a>
        </div>
    </form>

    <div class="form-footer">
        <p>默认管理员账号：<strong>admin</strong> / <strong>admin123</strong></p>
    </div>
</div>
{% endblock %}

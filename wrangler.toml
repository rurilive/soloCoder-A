name = "imgbed-worker"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "imgbed-db"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "imgbed-media"

[triggers]
crons = ["0 0 * * *"]

[dev]
port = 8787
local_protocol = "http"

[env.production]
name = "imgbed-worker"

[env.staging]
name = "imgbed-worker-staging"
